[program:cim_ems_demo_field]
; Svedala CIM-EMS demo field simulator (writes the SVEDALA_FIELD points, executes their breaker commands)
; demo only: start it together with cim_ems; environment created by src/cim-ems/install.sh
; args: configFile
command=/bin/sh -c "sleep 60 && /home/jsonscada/json-scada/src/cim-ems/.venv/bin/python -m cim_ems.demo_field /home/jsonscada/json-scada/conf/json-scada.json"
autostart=false
numprocs=1                     ; number of processes copies to start (def 1)
directory=/home/jsonscada/json-scada/src/cim-ems/                ; directory to cwd to before exec (def no cwd)
user=jsonscada                   ; setuid to this UNIX account to run the program
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/jsonscada/json-scada/log/cim_ems_demo_field.log    ; stdout log path, NONE for none; default AUTO
stdout_logfile_maxbytes=10MB   ; max # logfile bytes b4 rotation (default 50MB)
stdout_logfile_backups=10     ; # of stdout logfile backups (0 means none, default 10)
stdout_capture_maxbytes=10MB   ; number of bytes in 'capturemode' (default 0)
