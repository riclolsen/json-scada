# {json:scada} Docker Compilation for Linux x64 or Aarch64(ARM64) - (c) 2020-2026 - Ricardo L. Olsen
# Requires Internet connection!
#
# Builds the binaries and Node.js dependencies used by ../demo-docker/docker-compose.yaml.
# Binaries are published to ../demo-docker/bin for the architecture of the build host.
#
#     docker compose up
#
# The service set mirrors the build stages of the project root Dockerfile.

services:

  # Go drivers and processes: calculations, cs_data_processor (Go), IEC 60870-5-101/103/104,
  # IEC 61850 client/server, OPC-UA client, DNP3 client/server, Modbus client/server. Also copies the prebuilt
  # ICCP client/server binaries. Builds use the src/go.work workspace (shared go-common module).
  # CGO is disabled so the binaries are static and run on any Linux base image.
  go_compile:
    image: golang:1.27-alpine
    container_name: js_go_compile
    working_dir: /src
    command: sh -c "set -e &&
                    ARCH=$$(go env GOARCH) &&
                    cd /src/calculations && go build -ldflags='-s -w' -o /publish_bin/calculations &&
                    cd /src/cs_data_processor-go && go build -ldflags='-s -w' -o /publish_bin/cs_data_processor &&
                    cd /src/iec60870-5 &&
                    go build -ldflags='-s -w' -o /publish_bin/iec104client ./cmd/iec104client &&
                    go build -ldflags='-s -w' -o /publish_bin/iec104server ./cmd/iec104server &&
                    go build -ldflags='-s -w' -o /publish_bin/iec101client ./cmd/iec101client &&
                    go build -ldflags='-s -w' -o /publish_bin/iec101server ./cmd/iec101server &&
                    go build -ldflags='-s -w' -o /publish_bin/iec103client ./cmd/iec103client &&
                    cd /src/iec61850/iec61850_client && go build -ldflags='-s -w' -o /publish_bin/iec61850_client &&
                    cd /src/iec61850/iec61850_server && go build -ldflags='-s -w' -o /publish_bin/iec61850_server &&
                    cd /src/OPC-UA-Client-Go && go build -ldflags='-s -w' -o /publish_bin/opcua-client &&
                    cd /src/dnp3-go &&
                    go build -ldflags='-s -w' -o /publish_bin/dnp3-client ./cmd/dnp3client &&
                    go build -ldflags='-s -w' -o /publish_bin/dnp3-server ./cmd/dnp3server &&
                    cd /src/modbus-go &&
                    go build -ldflags='-s -w' -o /publish_bin/modbus-client ./cmd/modbusclient &&
                    go build -ldflags='-s -w' -o /publish_bin/modbus-server ./cmd/modbusserver &&
                    cp /src/iccp/iccp-client/iccp-client-linux-$${ARCH} /publish_bin/iccp-client &&
                    cp /src/iccp/iccp-server/iccp-server-linux-$${ARCH} /publish_bin/iccp-server &&
                    chmod +x /publish_bin/* &&
                    echo 'Go build finished.'"
    environment:
      - CGO_ENABLED=0
      - GOFLAGS=-buildvcs=false
      - GOTOOLCHAIN=auto
    volumes:
      - ../src:/src
      - ../demo-docker/bin:/publish_bin
      - go_mod_cache:/go/pkg/mod

  # PLC4J client (Java), the PLC4X protocol driver (Modbus, S7, EtherNet/IP, ...).
  plc4j_compile:
    image: maven:3-eclipse-temurin-21
    container_name: js_plc4j_compile
    command: sh -c "set -e &&
                    cd /src/plc4j-client &&
                    mvn -B -ntp -DskipTests package &&
                    cp target/plc4j-client.jar plc4j-client.sh /publish_bin/ &&
                    chmod +x /publish_bin/plc4j-client.sh &&
                    echo 'PLC4J build finished.'"
    volumes:
      - ../src/plc4j-client:/src/plc4j-client
      - ../demo-docker/bin:/publish_bin
      - maven_repo:/root/.m2

  # Node.js modules and web UI builds (same set as the project root Dockerfile).
  nodejs_update:
    image: node:22-alpine
    container_name: js_nodejs_update
    command:  sh -c "set -e && npm install -g npm &&
                     cd /src/cs_data_processor && npm install &&
                     cd /src/cs_custom_processor && npm install && npm run build &&
                     cd /src/config_server_for_excel && npm install &&
                     cd /src/grafana_alert2event && npm install &&
                     cd /src/demo_simul && npm install &&
                     cd /src/updateUser && npm install &&
                     cd /src/alarm_beep && npm install &&
                     cd /src/node-red-driver && npm install && npm run build &&
                     cd /src/n8n-client && npm install &&
                     cd /src/carbone-reports && npm install &&
                     cd /src/backup-mongo && npm install &&
                     cd /src/mongofw && npm install &&
                     cd /src/mongowr && npm install &&
                     cd /src/server_realtime_auth && npm install &&
                     cd /src/camera-onvif && npm install &&
                     cd /src/oshmi2json && npm install &&
                     cd /src/telegraf-listener && npm install &&
                     cd /src/OPC-UA-Server && npm install &&
                     cd /src/mqtt-sparkplug && npm install &&
                     cd /src/mcp-json-scada-db && npm install && npm run build &&
                     cd /src/AdminUI && npm install && npm run build &&
                     cd /src/svgedit && npm install && npm run build &&
                     cd /src/custom-developments/basic_bargraph && npm install && npx astro telemetry disable && npm run build &&
                     cd /src/custom-developments/advanced_dashboard && npm install && npm run build &&
                     cd /src/custom-developments/transformer_with_command && npm install && npm run build &&
                     chmod -R a+rwX /src/*/node_modules /src/custom-developments/*/node_modules &&
                     echo 'Node.js build finished.'"
    environment:
      - NODE_OPTIONS=--max-old-space-size=10000
    volumes:
      - ../src:/src

volumes:
  go_mod_cache:
  maven_repo:
