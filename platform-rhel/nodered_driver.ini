[program:nodered_driver]
; NODE-RED protocol driver (bidirectional Node-RED integration).
; args: instance# loglevel confFile
command=/usr/bin/node /home/jsonscada/json-scada/src/node-red-driver/dist/main.js 1 1 /home/jsonscada/json-scada/conf/json-scada.json
autostart=false
numprocs=1                     ; number of processes copies to start (def 1)
directory=/home/jsonscada/json-scada/src/node-red-driver/                ; directory to cwd to before exec (def no cwd)
user=jsonscada                   ; setuid to this UNIX account to run the program
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/jsonscada/json-scada/log/nodered_driver.log    ; stdout log path, NONE for none; default AUTO
stdout_logfile_maxbytes=10MB   ; max # logfile bytes b4 rotation (default 50MB)
stdout_logfile_backups=10     ; # of stdout logfile backups (0 means none, default 10)
stdout_capture_maxbytes=10MB   ; number of bytes in 'capturemode' (default 0)
