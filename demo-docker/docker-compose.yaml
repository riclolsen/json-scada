# {json:scada} Demo - (c) 2020-2026 - Ricardo L. Olsen

# ACCESS VIA WEB BROWSER AT http://127.0.0.1/
# Server must have tcp ports 80, 102, 8080, 3000, 5678, 6001, 6688, 20000, 27017, 5432, 2404, 4840, 10001 free!
# Must be online to connect to IEC60870-5-104 live demo server at 207.180.242.96:2404.
#
# BEFORE THE FIRST RUN: create the .env file holding a unique random JWT secret,
# otherwise compose stops with an error:
#     ./generate-env.sh          (Linux/macOS)
#     .\generate-env.ps1         (Windows PowerShell)
# Published ports are bound to JS_BIND_ADDR (127.0.0.1 by default).
#
# BEFORE THE FIRST RUN: build the binaries and Node.js modules with ../compile-docker:
#     cd ../compile-docker && docker compose up
# The Go drivers are static binaries in ./bin, run on a plain Alpine image (x-go-driver below).

# common settings for the Go drivers and processes, run from ./bin so that the default
# config path ../conf/json-scada.json resolves to the mounted ./conf folder
x-go-driver: &go-driver
  image: alpine:3
  restart: unless-stopped
  working_dir: /jsonscada_bin
  volumes:
    - ./conf:/conf
    - ./bin:/jsonscada_bin
    - ./log:/log
  links:
    - jsdemo_mongorsn1
  networks:
    - jsdemo_net

services:

# NO AUTHENTICATION IS PROVIDED HERE FOR MONGODB AND POSTGRESQL!

  # must create a mongodb instance or cluster with a replica set
  jsdemo_mongorsn1:
    image: mongo:9.0
    container_name: jsdemo_mongors1
    hostname: jsdemo_mongorsn1
    restart: unless-stopped
    command: "mongod --bind_ip_all --replSet rs1 --wiredTigerCacheSizeGB 1 --dbpath /data/db --port 27017"    
    extra_hosts:
      - "jsdemo_mongorsn1:127.0.0.1"
    volumes:
      - ./mongors1/files:/files
      - ./mongo_seed/files:/docker-entrypoint-initdb.d
    environment:
      - MONGO_INITDB_DATABASE=json_scada
    # to export mongodb port on main host!
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:27017:27017"
    # internal container port
    expose:
      - "27017"
    networks:
      - jsdemo_net
  
  # Postgresql/TimescaleDB historian. Without auth! 
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: jsdemo_timescaledb
    restart: unless-stopped
    #command: postgres -c shared_preload_libraries=timescaledb
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      #- POSTGRES_PASSWORD=passw0rd
    volumes:
      - ./postgres_seed:/docker-entrypoint-initdb.d/
      - ./sql_data:/sql_data
      #- ./timescale:/var/lib/postgresql
    # to export postgresql port on main host!
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:5432:5432"
    # internal container port
    expose:
      - "5432"
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # Postgresql/TimescaleDB Process SQL hist files 
  process_pg_hist:
    image: timescale/timescaledb-ha:pg18
    container_name: jsdemo_process_pg_hist
    command: /bin/sh /sql/process_pg_hist.sh
    restart: unless-stopped
    environment:
      - PGPORT=5432
      - PGHOST=jsdemo_timescaledb
      - PGDATABASE=json_scada
      - PGUSER=json_scada
      - PGPASSWORD=
    volumes:
      - ./sql:/sql
    links:
      - jsdemo_mongorsn1
      - timescaledb
    networks:
      - jsdemo_net

  # Postgresql/TimescaleDB Process SQL current data files 
  process_pg_rtdata:
    image: timescale/timescaledb-ha:pg18
    container_name: jsdemo_process_pg_rtdata
    command: /bin/sh /sql/process_pg_rtdata.sh
    restart: unless-stopped
    environment:
      - PGPORT=5432
      - PGHOST=jsdemo_timescaledb
      - PGDATABASE=json_scada
      - PGUSER=json_scada
      - PGPASSWORD=
    volumes:
      - ./sql:/sql
    links:
      - jsdemo_mongorsn1
      - timescaledb
    networks:
      - jsdemo_net

  grafana:
    image: grafana/grafana:latest
    container_name: jsdemo_grafana
    restart: unless-stopped
    # Grafana settings live in PostgreSQL (grafanaappdb); the named volume holds only local
    # runtime files and is created owned by the grafana user, so no host chown is needed
    volumes:
      - grafana_data:/var/lib/grafana
      # points the seeded PostgreSQL data source at the timescaledb service
      - ./conf/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment: 
      - GF_SERVER_DOMAIN=grafana
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:8080/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN=true
      - GF_AUTH_DISABLE_SIGNOUT_MENU=true
      # - GF_AUTH_PROXY_WHITELIST=127.0.0.1
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=true
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SERVER_ENFORCE_DOMAIN=true
      - GF_SERVER_ENABLE_GZIP=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_NAME=grafanaappdb
      - GF_DATABASE_HOST=timescaledb:5432
      - GF_DATABASE_USER=postgres
      #- GF_DATABASE_PASSWORD=
      #- GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      #- GF_AUTH_PROXY_HEADER_PROPERTY=username
      #- GF_AUTH_PROXY_AUTO_SIGN_UP=true      

    # export grafana port to the host
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:3000:3000"
    expose:
      - "3000"
    depends_on:
      - timescaledb
    networks:
      - jsdemo_net
  
  # IEC60870-5-104 CLIENT, will connect to a demo server
  iec104client:
    <<: *go-driver
    container_name: jsdemo_iec104client
    command: sh -c "sleep 60 && ./iec104client 1 1"

  # OPC-UA CLIENT (Go), connects to public OPC-UA demo servers
  opcua_client:
    <<: *go-driver
    container_name: jsdemo_opcua_client
    command: sh -c "sleep 60 && ./opcua-client 1 1"

  # IEC60870-5-104 SERVER, demo config accepts connection on 127.0.0.1:2404 (originator address 1)
  iec104server:
    <<: *go-driver
    container_name: jsdemo_iec104server
    command: sh -c "sleep 60 && ./iec104server 1 1"
    # exports the iec 104 server port to the host
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:2404:2404"
    expose:
      - "2404"

  # IEC 61850 MMS SERVER, demo config accepts connections on 127.0.0.1:102
  iec61850server:
    <<: *go-driver
    container_name: jsdemo_iec61850server
    command: sh -c "sleep 60 && ./iec61850_server 1 1"
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:102:102"
    expose:
      - "102"

  # ICCP (TASE.2) SERVER, listens on port 102 inside the docker network only
  # (host port 102 is taken by the IEC 61850 server)
  iccp_server:
    <<: *go-driver
    container_name: jsdemo_iccp_server
    command: sh -c "sleep 60 && ./iccp-server 1 1"
    expose:
      - "102"

  # process incoming data 
  cs_data_processor:
    image: node:22-alpine
    container_name: jsdemo_cs_data_processor
    command:  sh -c "cd /cs_data_processor && sleep 50 && node cs_data_processor.js"
    restart: unless-stopped
    volumes:
      - ../src/cs_data_processor:/cs_data_processor
      - ./sql:/sql
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # custom script processor
  cs_custom_processor:
    image: node:22-alpine
    container_name: jsdemo_cs_custom_processor
    command:  sh -c "cd /cs_custom_processor && sleep 50 && node dist/cs_custom_processor.js"
    restart: unless-stopped
    volumes:
      - ../src/cs_custom_processor:/cs_custom_processor
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # config server for excel
  config_server_excel:
    image: node:22-alpine
    container_name: jsdemo_config_server_excel
    command:  sh -c "cd /config_server_for_excel && sleep 60 && node index.js"
    restart: unless-stopped
    environment:
      - JS_CSEXCEL_IP_BIND=0.0.0.0
      - JS_CSEXCEL_HTTP_PORT=10001
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:10001:10001"
    expose:
      - "10001"
    volumes:
      - ../src/config_server_for_excel:/config_server_for_excel
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # mqtt sparkplug-b driver
  mqtt-sparkplug:
    image: node:22-alpine
    container_name: jsdemo_mqtt-sparkplug
    command:  sh -c "cd /mqtt-sparkplug && sleep 60 && node index.js"
    restart: unless-stopped
    volumes:
      - ../src/mqtt-sparkplug:/mqtt-sparkplug
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # N8N integration driver (bidirectional n8n integration)
  n8n-client:
    image: node:22-alpine
    container_name: jsdemo_n8n-client
    command:  sh -c "cd /n8n-client && sleep 60 && node index.js"
    restart: unless-stopped
    expose:
      - "51930"
    volumes:
      - ../src/n8n-client:/n8n-client
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # Optional: n8n workflow-automation platform. n8n is fair-code licensed; this pulls
  # the public image at runtime (not bundled/redistributed by JSON-SCADA). Enable the
  # N8N1 demo connection in the AdminUI to try the integration end-to-end.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jsdemo_n8n
    restart: unless-stopped
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - jsdemo_net

  # OPC-UA Server
  opcua_server:
    image: node:22-alpine
    container_name: jsdemo_opcua_server
    command:  sh -c "cd /OPC-UA-Server && sleep 60 && node index.js"
    restart: unless-stopped
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:4840:4840"
    expose:
      - "4840"
    volumes:
      - ../src/OPC-UA-Server:/OPC-UA-Server
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # realtime web server, will listen on some HTTP port with auth, RBAC management UI
  server_realtime:
    image: node:22-alpine
    container_name: jsdemo_server_realtime_auth
    command:  sh -c "cd /server_realtime_auth && sleep 50 && node index.js"
    restart: unless-stopped
    environment:
      # Secret used to sign the JWT session tokens. It MUST be unique and private
      # for every installation: whoever knows it can forge admin tokens and send
      # commands to field devices. Generate it with ./generate-env.sh (or
      # ./generate-env.ps1 on Windows), which writes it to the .env file.
      - JS_JWT_SECRET=${JS_JWT_SECRET:?not set - run ./generate-env.sh (Linux/macOS) or ./generate-env.ps1 (Windows) in the demo-docker folder to create a .env file with a unique random secret}
      - JS_IP_BIND=0.0.0.0
      - JS_HTTP_PORT=8080
      - JS_GRAFANA_SERVER=http://grafana:3000
      - JS_LOGIO_SERVER=http://dozzle:6688
      - JS_METABASE_SERVER=http://metabase:3000
      - NODERED_SERVER=http://nodered:1880/nodered/
      - PGPORT=5432
      - PGHOST=jsdemo_timescaledb
      - PGDATABASE=json_scada
      - PGUSER=json_scada
      - PGPASSWORD=
    volumes:
      - ../src/server_realtime_auth:/server_realtime_auth
      - ../src/AdminUI:/AdminUI
      - ../src/custom-developments:/custom-developments
      - ../svg:/svg
      - ../src/svgedit:/svgedit
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
      - grafana
      - dozzle
      - nodered
      - metabase
    # exports the HTTP port to the main host
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:8080:8080"
    expose:
      - "8080"
    networks:
      - jsdemo_net
    
  # MCP server for AI assistants (Model Context Protocol, streamable HTTP), at
  # http://127.0.0.1:6001/mcp on the host. Read tools and tag commands are always on.
  # The configuration and process management tools are enabled only when
  # JS_MCPJSDB_ADMIN_USERNAME and JS_MCPJSDB_ADMIN_PASSWORD (an AdminUI admin user)
  # are set in .env. Host/Origin are checked against JS_MCPJSDB_ALLOWED_HOSTS
  # (DNS rebinding protection), so add the host name when publishing it elsewhere.
  mcp_server:
    image: node:22-alpine
    container_name: jsdemo_mcp_server
    command: sh -c "cd /src/mcp-json-scada-db && sleep 50 && node dist/mcp-server.js"
    restart: unless-stopped
    environment:
      - JS_CONFIG_FILE=/conf/json-scada.json
      - JS_MCPJSDB_TRANSPORT=http
      - JS_MCPJSDB_IP_BIND=0.0.0.0
      - JS_MCPJSDB_HTTP_PORT=6001
      - JS_MCPJSDB_ALLOWED_HOSTS=${JS_MCPJSDB_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      - JS_MCPJSDB_ADMIN_URL=http://server_realtime:8080
      - JS_MCPJSDB_ADMIN_USERNAME=${JS_MCPJSDB_ADMIN_USERNAME:-}
      - JS_MCPJSDB_ADMIN_PASSWORD=${JS_MCPJSDB_ADMIN_PASSWORD:-}
      - JS_MCPJSDB_SRC_DIR=/src
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:6001:6001"
    expose:
      - "6001"
    volumes:
      # driver READMEs under src/ are served by the driver documentation tools
      - ../src:/src:ro
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
      - server_realtime
    networks:
      - jsdemo_net

  # calculation process
  calculations:
    <<: *go-driver
    container_name: jsdemo_calculations
    command: sh -c "sleep 50 && ./calculations 1 1 2"

  # DNP3 SERVER, demo config accepts connection on 127.0.0.1:20000 (local address 2, remote address 1)
  dnp3server:
    <<: *go-driver
    container_name: jsdemo_dnp3server
    command: sh -c "sleep 60 && ./dnp3-server 1 1"
    # exports the DNP3 server port to the host
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:20000:20000"
    expose:
      - "20000"

  # DNP3 CLIENT, demo config polls the DNP3 server above (jsdemo_dnp3server:20000)
  dnp3client:
    <<: *go-driver
    container_name: jsdemo_dnp3client
    command: sh -c "sleep 70 && ./dnp3-client 1 1"

  telegraf_listener:
    image: node:22-alpine
    container_name: jsdemo_telegraf_listener
    command:  sh -c "cd /telegraf-listener && sleep 50 && node index.js"
    restart: unless-stopped
    volumes:
      - ../src/telegraf-listener:/telegraf-listener
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  telegraf_tool:
    image: telegraf:alpine
    container_name: jsdemo_telegraf_tool
    restart: unless-stopped
    volumes:
      - ./conf/telegraf.conf:/etc/telegraf/telegraf.conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
      - telegraf_listener
    networks:
      - jsdemo_net

  # NODE-RED integration driver: WebSocket JSON server (port 51931 on the docker network)
  # that Node-RED flows connect to with the node-red-contrib-jsonscada palette.
  # Seeded instance NODE-RED 1, connection NODERED1. Built by ../compile-docker.
  nodered_driver:
    image: node:22-alpine
    container_name: jsdemo_nodered_driver
    command: sh -c "cd /node-red-driver && sleep 50 && node dist/main.js 1 1 /conf/json-scada.json"
    restart: unless-stopped
    expose:
      - "51931"
    volumes:
      - ../src/node-red-driver:/node-red-driver
      - ./conf:/conf
      - ./log:/log
    links:
      - jsdemo_mongorsn1
    networks:
      - jsdemo_net

  # Node-RED runtime with the node-red-contrib-jsonscada palette, installed into the data
  # volume on first start. The editor is served on /nodered/ and reached through the web UI
  # at http://127.0.0.1/nodered (login required, admin only), so its port is not published.
  # In a flow, point the jsonscada server config node at jsdemo_nodered_driver:51931.
  # The flows credential secret is generated into the data volume on first start
  # (set JS_NODERED_CRED_SECRET in .env to override it).
  nodered:
    image: nodered/node-red:latest
    container_name: jsdemo_nodered
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        cd /data
        [ -f node_modules/node-red-contrib-jsonscada/package.json ] || npm install --no-audit --no-fund node-red-contrib-jsonscada
        if [ -z "$$JS_NODERED_CRED_SECRET" ]; then
          [ -s .cred_secret ] || ( umask 077 && head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n' > .cred_secret )
          export JS_NODERED_CRED_SECRET=$$(cat .cred_secret)
        fi
        cd /usr/src/node-red
        exec node node_modules/node-red/red.js --settings /data/settings.js
    environment:
      - JS_NODERED_USERDIR=/data
      - JS_NODERED_HOST=0.0.0.0
      - JS_NODERED_PORT=1880
      - JS_NODERED_CRED_SECRET=${JS_NODERED_CRED_SECRET:-}
      - TZ=UTC
    expose:
      - "1880"
    volumes:
      - nodered_data:/data
      # JSON-SCADA settings (editor on /nodered/), at the path the image healthcheck reads
      - ../conf-templates/node-red-settings.js:/data/settings.js:ro
    links:
      - nodered_driver
    networks:
      - jsdemo_net

  # Metabase for dashboards (can connect to MongoDB and PostgreSQL). Its application
  # database is metabaseappdb on the TimescaleDB server (seeded from sql_data).
  # Reached through the web UI at http://127.0.0.1/metabase/ (JSON-SCADA login required),
  # then Metabase login json@scada.com / jsonscada123. MB_SITE_URL sets the page base path,
  # so the UI works only under /metabase/ and the port is not published.
  metabase:
    image: metabase/metabase:latest
    container_name: jsdemo_metabase
    restart: unless-stopped
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabaseappdb
      - MB_DB_PORT=5432
      - MB_DB_USER=postgres
      - MB_DB_PASS=
      - MB_DB_HOST=timescaledb
      - MB_SITE_URL=http://127.0.0.1/metabase/
      - MB_CHECK_FOR_UPDATES=false
      - MB_ANON_TRACKING_ENABLED=false
    expose:
      - "3000"
    depends_on:
      - timescaledb
    links:
      - jsdemo_mongorsn1
      - timescaledb
    networks:
      - jsdemo_net

  nginx:
    image: nginx:latest
    container_name: jsdemo_nginx
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:80:80"
    expose:
      - "80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/fastcgi.conf:/etc/nginx/fastcgi.conf
      - ./conf/nginx-conf.d:/etc/nginx/conf.d
      - ../src/AdminUI:/AdminUI
      - ../src/custom-developments:/custom-developments
      - ../svg:/svg
      - ../src/svgedit:/svgedit
    restart: unless-stopped
    links:
      - server_realtime
    networks:
      - jsdemo_net

  # monitoring of logs of the docker containers
  dozzle:
    container_name: jsdemo_dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_ADDR=0.0.0.0:6688
      - DOZZLE_BASE=/log-io
      - DOZZLE_NO_ANALYTICS=true
      # - DOZZLE_LEVEL=debug
    ports:
      - "${JS_BIND_ADDR:-127.0.0.1}:6688:6688"
    expose:
      - "6688"
    networks:
      - jsdemo_net

networks:
  jsdemo_net:
    driver: bridge

volumes:
  grafana_data:
  n8n_data:
  nodered_data:
