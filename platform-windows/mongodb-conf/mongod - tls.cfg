net:
  bindIp: 0.0.0.0
  port: 27017
  ssl:
    mode: requireSSL
    PEMKeyFile: c:\json-scada\conf\mongodb.pem
    CAFile: c:\json-scada\conf\rootCa.pem

storage:
  dbPath: c:\json-scada\platform-windows\mongodb-data

# REPLICA IS REQUIRED FOR JSON-SCADA
replication:
  replSetName: rs1

setParameter:
  diagnosticDataCollectionEnabled: false
  # change streams deliver only majority-committed (journaled) writes: flush the journal often
  journalCommitInterval: 10
  # keep snapshot history short (JSON-SCADA does no point-in-time reads); relieves the cache
  minSnapshotHistoryWindowInSeconds: 10
  # fixed concurrency tickets instead of throughput probing, which throttles bursty change stream reads
  storageEngineConcurrencyAdjustmentAlgorithm: fixedConcurrentTransactions
#  enableLocalhostAuthBypass: false
